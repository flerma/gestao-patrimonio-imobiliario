services:

  banco:
    image: postgres:16
    container_name: gestao-patrimonio-banco
    restart: unless-stopped

    environment:
      POSTGRES_DB: gestao_patrimonio_imobiliario
      POSTGRES_USER: gestao_patrimonio
      POSTGRES_PASSWORD: gestao_patrimonio

    ports:
      - "5432:5432"

    volumes:
      - dados_postgres:/var/lib/postgresql/data

    networks:
      - gestao-patrimonio

  backend:
    build: .
    container_name: gestao-patrimonio-backend
    restart: unless-stopped

    depends_on:
      - banco

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/gestao_patrimonio_imobiliario
      SPRING_DATASOURCE_USERNAME: gestao_patrimonio
      SPRING_DATASOURCE_PASSWORD: gestao_patrimonio
      JWT_SECRET: "PqYY929/jP02tH95FWJ0G+zv4l1m7uuLTitSzYB5CTlLm5lNloj+GZqE99sX21pY"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://gestao-patrimonio-frontend.vercel.app,https://www.gestaoseupatrimonio.com.br,https://gestaoseupatrimonio.com.br"

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - gestao-patrimonio

volumes:
  dados_postgres:

networks:
  gestao-patrimonio: