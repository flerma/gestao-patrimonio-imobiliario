spring:
  application:
    name: gestao-patrimonio-imobiliario
  datasource:
    url: jdbc:postgresql://localhost:5433/gestao_patrimonio_imobiliario
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  cloud:
    openfeign:
      client:
        config:
          viaCepClient:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: basic
          ibgeClient:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: basic

# Provedor externo de consulta de endereço por CEP.
integracao:
  viacep:
    url: https://viacep.com.br/ws
  # Provedor externo de consulta de municípios por UF.
  ibge:
    url: https://servicodados.ibge.gov.br/api/v1/localidades
  # Serviço de push da Expo. access-token é opcional (defina EXPO_ACCESS_TOKEN
  # se ativar "Enhanced Security for Push Notifications" no projeto Expo).
  expo:
    push-url: https://exp.host/--/api/v2/push/send
    access-token: ${EXPO_ACCESS_TOKEN:}

# Resumo diário de alertas por push (só dispara com a aplicação no ar).
notificacao:
  resumo-diario:
    cron: "0 0 8 * * *"

# Autenticação JWT (access token 1h, refresh token opaco de 7 dias).
security:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-precisa-ter-pelo-menos-256-bits-de-tamanho}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  # Login com Google: client IDs OAuth aceitos como audiencia do ID token,
  # separados por virgula (normalmente so o client "Aplicativo da Web").
  # Vazio = login com Google desativado (POST /api/auth/google responde 503).
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:435511220295-5ku76179fqc3j90id3h27k5sptjhd69n.apps.googleusercontent.com}

# E-mail (SMTP) - usado no "Esqueceu a sua senha?". Qualquer provedor SMTP
# (Gmail com senha de app, Amazon SES, Brevo, Resend...). MAIL_HOST vazio =
# e-mails nao sao enviados e o conteudo vai para o log (uso local).
spring.mail:
  host: ${MAIL_HOST:}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    mail.smtp.connectiontimeout: 10000
    mail.smtp.timeout: 10000
    mail.smtp.writetimeout: 10000

app:
  mail:
    # Remetente exibido no e-mail, ex.: "Gestão Seu Patrimônio <nao-responda@gestaoseupatrimonio.com.br>"
    remetente: ${MAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
